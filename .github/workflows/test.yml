name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests and doctests. `--all-features` includes the `core` feature,
      # which gates `SessionStateBuilderSpark` and its tests.
      - run: cargo test -p datafusion-spark --all-features
