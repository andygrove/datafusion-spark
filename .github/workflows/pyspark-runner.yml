name: PySpark runner

on:
  push:
    branches: [main]
    paths:
      - "crates/sqllogictest/scripts/**"
      - "crates/sqllogictest/test_files/**"
      - ".github/workflows/pyspark-runner.yml"
  pull_request:
    paths:
      - "crates/sqllogictest/scripts/**"
      - "crates/sqllogictest/test_files/**"
      - ".github/workflows/pyspark-runner.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: PySpark runner unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s crates/sqllogictest/scripts

  spark:
    name: Run the sqllogictests on Spark ${{ matrix.spark }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.5"
            requirements: requirements-spark-3.5.txt
          - spark: "4.2"
            requirements: requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crates/sqllogictest/scripts/${{ matrix.requirements }}
      - run: pip install -r crates/sqllogictest/scripts/${{ matrix.requirements }}
      # Exits with status 1 if any record differs from Spark without an
      # `# xfail spark:` comment for this Spark version, or has one but now passes.
      - run: python crates/sqllogictest/scripts/pyspark_slt_runner.py
