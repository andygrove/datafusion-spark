name: PySpark runner

# The workflow runs on every pull request, so that its `PySpark runner` job
# always reports and can be a required check. A `paths` filter would leave the
# check pending, and block the pull request, when the paths do not change.
# Instead the `changes` job skips the Spark jobs when nothing they test changed.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Check for PySpark runner changes
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.diff.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ] ||
            git diff --name-only "$BASE" HEAD -- \
              crates/sqllogictest/scripts \
              crates/sqllogictest/test_files \
              .github/workflows/pyspark-runner.yml | grep -q .; then
            echo runner=true >> "$GITHUB_OUTPUT"
          else
            echo runner=false >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    name: PySpark runner unit tests
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s crates/sqllogictest/scripts

  spark:
    name: Run the sqllogictests on Spark ${{ matrix.spark }}
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - spark: "3.5"
            requirements: requirements-spark-3.5.txt
          - spark: "4.2"
            requirements: requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crates/sqllogictest/scripts/${{ matrix.requirements }}
      - run: pip install -r crates/sqllogictest/scripts/${{ matrix.requirements }}
      # Exits with status 1 if any record differs from Spark without an
      # `# xfail spark:` comment for this Spark version, or has one but now passes.
      - run: python crates/sqllogictest/scripts/pyspark_slt_runner.py

  # The required check. It passes when the jobs above pass or are skipped.
  result:
    name: PySpark runner
    needs: [changes, unit-tests, spark]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
