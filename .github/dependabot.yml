# The pip requirements of the PySpark runner are not listed here on purpose:
# `pyspark` is pinned to the Spark version that the sqllogictest files are
# checked against, and changing it is a decision, not a routine update.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 15
    # `datafusion-spark` is a library, so leave a requirement in Cargo.toml as
    # it is when it already allows the new version. Raising it would force the
    # same minimum on downstream users. Cargo.lock is still updated.
    versioning-strategy: increase-if-necessary
    ignore:
      # DataFusion is updated by hand. `main` follows a DataFusion release tag
      # or branch, and moving it is a decision, not a routine update.
      - dependency-name: "datafusion*"
      # `datafusion-spark` 56.x stays on the arrow version DataFusion 56 uses,
      # so arrow's major version changes only when `main` moves to the next
      # DataFusion major version. See dev/release/README.md#versioning.
      - dependency-name: "arrow*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates of everything else go in one pull request.
      all-other-cargo-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "datafusion*"
          - "arrow*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
