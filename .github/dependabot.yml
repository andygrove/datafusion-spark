# The pip requirements of the PySpark runner are not listed here on purpose:
# `pyspark` is pinned to the Spark version that the sqllogictest files are
# checked against, and changing it is a decision, not a routine update.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    target-branch: main
    open-pull-requests-limit: 15
    ignore:
      # `datafusion-spark` 56.x stays on DataFusion 56 and the arrow version it
      # uses, so their major versions change only when `main` moves to the next
      # DataFusion major version. See dev/release/README.md#versioning.
      - dependency-name: "datafusion*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "arrow*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates of everything else go in one pull request.
      all-other-cargo-deps:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "datafusion*"
          - "arrow*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
