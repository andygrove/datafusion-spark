[workspace]
resolver = "2"
members = ["crates/cli", "crates/docgen", "crates/spark", "crates/sqllogictest"]
# The CLI pulls in datafusion-cli and its object store dependencies, so a plain
# `cargo build` or `cargo test` at the root skips it. `--workspace` includes it.
default-members = ["crates/docgen", "crates/spark", "crates/sqllogictest"]

[workspace.package]
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
edition = "2024"
homepage = "https://datafusion.apache.org"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/apache/datafusion-spark"
rust-version = "1.95.0"
version = "56.0.0"

[workspace.dependencies]
arrow = { version = "60.0.0", features = ["prettyprint", "chrono-tz"] }
bigdecimal = "0.4.8"
chrono = { version = "0.4.45", default-features = false }
criterion = "0.8"
datafusion = { version = "56.0.0", default-features = false }
datafusion-common = { version = "56.0.0", default-features = false }
datafusion-expr = { version = "56.0.0", default-features = false }
datafusion-doc = "56.0.0"
datafusion-functions = "56.0.0"
datafusion-functions-aggregate = "56.0.0"
datafusion-functions-aggregate-common = "56.0.0"
datafusion-functions-nested = { version = "56.0.0", default-features = false }
datafusion-macros = "56.0.0"
datafusion-physical-expr-common = { version = "56.0.0", default-features = false }
datafusion-session = "56.0.0"
log = "^0.4"
num-traits = { version = "0.2" }
rand = "0.9"
serde = "1"
serde_json = "1"
sha2 = "^0.11.0"
tokio = { version = "1.52", features = ["macros", "rt", "sync"] }
url = "2.5.7"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(coverage)",
    "cfg(coverage_nightly)",
] }
unused_qualifications = "deny"
